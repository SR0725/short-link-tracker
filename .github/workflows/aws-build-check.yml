# 暫時的（AWS 搬家驗證用）：push aws-deploy 分支時，在 GitHub 的 ARM runner 建 linux/arm64 映像推到 GHCR，
# 搬家 session 再複製到 ECR 部署驗證。驗證完會從這個 PR 拿掉，正式部署走 deploy.yml。
name: aws-build-check
on: { push: { branches: [aws-deploy] } }
permissions: { contents: read, packages: write }
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/sr0725/ray-build-short-link-tracker:${{ github.sha }}
